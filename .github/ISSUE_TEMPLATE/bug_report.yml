name: "Сообщение об ошибке / Bug report"
description: "Что-то работает не так / Something works incorrectly"
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: "Что происходит / What happened"
      description: "Опишите проблему; приложите скриншот, если он помогает. / Describe the problem; attach a screenshot if it helps."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Шаги воспроизведения / Steps to reproduce"
      placeholder: "1. …"
  - type: input
    id: version
    attributes:
      label: "Версия / Version"
      description: "Кликните по номеру версии в правом нижнем углу приложения. / Click the version number in the app's bottom-right corner."
    validations:
      required: true
