name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The macOS line lives in Wad-man/prosa-mac (#121): every job here is
  # pinned to this repository so the fork's synced copy of this file never
  # runs the Windows/Linux matrix there (prosa-mac carries its own
  # ci-macos.yml).
  frontend:
    name: Typecheck & build frontend
    if: github.repository == 'Wad-man/prosa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm run build

  windows:
    name: Windows build (x64)
    if: github.repository == 'Wad-man/prosa'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
        env:
          # createUpdaterArtifacts is on, so the builder refuses to finish
          # without the signing key — same secret the Release workflow uses
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: prosa-windows-x64
          path: |
            src-tauri/target/release/prosa.exe
            src-tauri/target/release/bundle/nsis/*.exe

  # Cross-platform smoke builds: prove the app compiles and bundles on
  # Linux on every push/PR to main (macOS moved to prosa-mac, #121). No
  # release, no code signing, no updater artifacts — that stays a
  # Windows/Linux-only release concern. These jobs have no `needs:` and
  # nothing depends on them, so a red cross-build never blocks the
  # tsc/vite gate or the Windows build.
  #
  # tauri.conf.json ships bundle.targets=["nsis"] (Windows-only) and
  # createUpdaterArtifacts=true (requires TAURI_SIGNING_PRIVATE_KEY), so
  # the cross job overrides both on the CLI:
  #   --bundles <platform format>              instead of the "nsis" target
  #   --config createUpdaterArtifacts=false    skip updater signing entirely

  linux:
    name: Linux build (${{ matrix.arch }}, AppImage + deb)
    if: github.repository == 'Wad-man/prosa'
    # deb is the primary Linux format (#105): it declares webkit2gtk-4.1 a
    # system dependency (units of MB instead of the ~84 MB self-contained
    # AppImage) and installs the icon and .md associations; AppImage stays
    # as the portable option for distros without that package
    strategy:
      # keep the x64 leg's result even if arm64 fails (and vice versa)
      fail-fast: false
      matrix:
        include:
          - arch: x64
            # 22.04 (glibc 2.35), not latest: keeps the AppImage runnable
            # on Debian 12 / Ubuntu 22.04-era systems
            os: ubuntu-22.04
          - arch: arm64
            # native arm64 runner — free for public repositories
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri v2 system dependencies
        # official list from https://tauri.app/start/prerequisites/
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-${{ matrix.arch }}
      - run: npm ci
      - name: Build unsigned AppImage and deb
        run: npx tauri build --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: prosamd-linux-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
