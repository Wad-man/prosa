name: Label new issues

# Issue forms apply their `labels:` only for authors with write access;
# everyone else lands here unlabelled. Detect the form by its headings and
# add the same label.
on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body ?? '';
            const existing = (context.payload.issue.labels ?? []).map((l) => l.name);
            const wanted = [];
            if (body.includes('Что происходит / What happened')) wanted.push('bug');
            if (body.includes('Идея / The idea')) wanted.push('enhancement');
            const toAdd = wanted.filter((l) => !existing.includes(l));
            if (!toAdd.length) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: toAdd,
            });
