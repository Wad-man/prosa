<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#D9452B" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>ProsaMD</title>
    <script>
      // Apply theme before first paint to avoid flashing
      (function () {
        var stored = localStorage.getItem('prosa.theme');
        var theme =
          stored ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app" class="empty" data-mode="visual">
      <header id="toolbar" role="toolbar">
        <div class="tb-group">
          <button id="btn-open" class="btn" data-tip-pos="start">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg>
            <span class="btn-label" id="lbl-open"></span>
          </button>
          <button id="btn-save" class="btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
            <span class="btn-label" id="lbl-save"></span>
          </button>
          <button id="btn-save-as" class="btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v9.5"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10.4 12.6a2 2 0 0 1 3 3L8 21l-4 1 1-4Z"/></svg>
            <span class="btn-label" id="lbl-saveas"></span>
          </button>
        </div>
        <div class="tb-spacer"></div>
        <div class="tb-group">
          <button id="btn-lang" class="btn btn-icon"><span id="lbl-lang">EN</span></button>
          <button id="btn-theme" class="btn btn-icon">
            <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <span class="tb-sep" aria-hidden="true"></span>
          <div id="mode-switch" class="seg" role="tablist" data-active="visual">
            <span class="seg-thumb" aria-hidden="true"></span>
            <button id="btn-mode-visual" class="seg-btn" role="tab" data-tip-pos="end">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button id="btn-mode-source" class="seg-btn" role="tab" data-tip-pos="end">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/><path d="m14.5 4-5 16"/></svg>
            </button>
          </div>
        </div>
      </header>

      <main id="editor-host">
        <div id="empty-hint" aria-hidden="true">
          <div class="eh-inner">
            <div class="eh-badge">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>
            </div>
            <div class="eh-line" id="eh-line"></div>
            <div class="eh-keys">
              <span class="eh-key"><kbd>Ctrl+O</kbd><span id="eh-open"></span></span>
              <span class="eh-key"><kbd>Ctrl+/</kbd><span id="eh-mode"></span></span>
            </div>
          </div>
        </div>
        <div id="visual-editor" class="editor-pane"></div>
        <div id="source-editor" class="editor-pane"></div>
      </main>

      <footer id="statusbar">
        <div class="st-left">
          <span id="st-modified" class="st-mod" hidden></span>
          <span id="st-path"></span>
        </div>
        <div class="st-right">
          <span id="st-count"></span>
          <button id="st-version" class="st-version" type="button" hidden></button>
        </div>
      </footer>
    </div>

    <div id="about-overlay" class="modal-overlay" hidden>
      <div class="modal modal-about" role="dialog" aria-modal="true">
        <button id="about-close" class="modal-x" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <img class="about-logo about-logo-color" src="/prosamd-horizontal.svg" alt="ProsaMD" width="220" height="63" draggable="false">
        <img class="about-logo about-logo-white" src="/prosamd-horizontal-white.svg" alt="ProsaMD" width="220" height="63" draggable="false">
        <p class="about-version" id="about-version"></p>
        <p class="about-desc" id="about-desc"></p>
        <nav class="about-links">
          <a href="https://github.com/Wad-man/prosa" target="_blank" rel="noreferrer">GitHub</a>
          <a id="about-license" href="https://github.com/Wad-man/prosa/blob/main/LICENSE" target="_blank" rel="noreferrer"></a>
          <a id="about-feedback" href="https://github.com/Wad-man/prosa-releases/issues/new" target="_blank" rel="noreferrer"></a>
        </nav>
        <button id="about-check" class="modal-btn" type="button"></button>
      </div>
    </div>

    <div id="close-overlay" class="modal-overlay" hidden>
      <div class="modal modal-close-confirm" role="dialog" aria-modal="true" aria-labelledby="cc-text">
        <p class="cc-text" id="cc-text"></p>
        <div class="modal-actions">
          <button id="cc-dont-save" class="modal-btn" type="button"></button>
          <button id="cc-cancel" class="modal-btn" type="button"></button>
          <button id="cc-save" class="modal-btn modal-btn-primary" type="button"></button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
