[package]
name = "prosa"
version = "0.3.0-rc.3"
description = "ProsaMD — a minimal open-source Markdown editor & viewer"
authors = ["Wad-man"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix is necessary to keep the lib name unique vs the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "prosa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `prosa_mac` gates the macOS-only modules (native menu, watchdog checker);
# only the prosa-mac fork sets it, via .cargo/config.toml (#121)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(prosa_mac)'] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only: forward "open with file" launches to the running instance;
# in-app updates + relaunch after install
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Windows-only: silent PrintToPdf (#24) — versions match what tauri's
# webview stack already resolves, so nothing extra enters the tree
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# Size optimization guideline: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
